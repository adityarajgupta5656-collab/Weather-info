<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Application | Aditya Raj Gupta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:#fff;
    }
    .container{width:100%;max-width:420px}
    
    .header{
      text-align:center;
      margin-bottom:15px;
    }
    .header h2{
      font-size:1.3rem;
      font-weight:500;
      opacity:0.9;
      letter-spacing:1px;
    }
    .header .name{
      font-size:0.85rem;
      opacity:0.7;
      margin-top:3px;
    }
    
    .card{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(25px);
      border-radius:25px;
      padding:1.8rem;
      box-shadow:0 25px 45px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.1);
    }
    
    .search{
      display:flex;
      background:rgba(255,255,255,0.15);
      border-radius:50px;
      padding:5px 5px 5px 18px;
      margin-bottom:20px;
    }
    .search input{
      flex:1;
      background:0;
      border:0;
      outline:0;
      color:#fff;
      font-size:0.95rem;
      padding:10px 0;
    }
    .search input::placeholder{color:rgba(255,255,255,0.6)}
    .search button{
      background:#00d2ff;
      border:0;
      border-radius:50%;
      width:42px;
      height:42px;
      cursor:pointer;
      color:#0f2027;
      font-size:1rem;
      transition:0.3s;
    }
    .search button:hover{background:#00a8cc;transform:scale(1.05)}
    
    .loading{text-align:center;padding:30px 0;display:none}
    .loading i{font-size:2.5rem;color:#00d2ff}
    
    .error{
      background:rgba(255,60,60,0.25);
      padding:12px 18px;
      border-radius:12px;
      margin:10px 0;
      display:none;
      font-size:0.9rem;
      text-align:center;
      border:1px solid rgba(255,100,100,0.3);
    }
    
    #weather{display:block}
    
    .location-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
      flex-wrap:wrap;
      gap:8px;
    }
    .city{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:1.3rem;
      font-weight:600;
    }
    .city i{color:#00d2ff;font-size:1.2rem}
    .date-tag{
      background:rgba(255,255,255,0.12);
      padding:5px 14px;
      border-radius:20px;
      font-size:0.8rem;
      letter-spacing:0.5px;
    }
    
    .main-weather{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:10px 0 5px;
    }
    .temp-section span{
      font-size:5.5rem;
      font-weight:700;
      line-height:1;
      background:linear-gradient(135deg,#fff,#c0e8ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .weather-icon{
      font-size:4.5rem;
      color:#ffd966;
      filter:drop-shadow(0 5px 15px rgba(255,217,102,0.4));
    }
    .desc{
      font-size:1.1rem;
      text-transform:capitalize;
      margin-bottom:20px;
      opacity:0.85;
    }
    
    .divider{
      height:1px;
      background:rgba(255,255,255,0.15);
      margin:15px 0;
    }
    
    .details-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      text-align:center;
    }
    .detail-box{
      background:rgba(255,255,255,0.06);
      border-radius:15px;
      padding:14px 6px;
      transition:0.3s;
      border:1px solid rgba(255,255,255,0.08);
    }
    .detail-box:hover{background:rgba(255,255,255,0.12)}
    .detail-box i{font-size:1.4rem;color:#00d2ff;display:block;margin-bottom:6px}
    .detail-box .label{font-size:0.7rem;text-transform:uppercase;opacity:0.7;letter-spacing:1px}
    .detail-box .val{font-size:1.1rem;font-weight:700;margin-top:3px}
    
    .footer{
      text-align:center;
      margin-top:18px;
      font-size:0.7rem;
      opacity:0.6;
      letter-spacing:0.5px;
    }
    .footer .highlight{color:#00d2ff;font-weight:600}
    
    @media(max-width:380px){
      .card{padding:1.2rem}
      .temp-section span{font-size:4rem}
      .weather-icon{font-size:3.5rem}
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Personal Header -->
    <div class="header">
      <h2>🌤️ Weather Application</h2>
      <div class="name">Developed by <strong>Aditya Raj Gupta</strong></div>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- Search -->
      <div class="search">
        <input type="text" id="city" placeholder="Search city..." autocomplete="off">
        <button onclick="getWeather()"><i class="fas fa-search"></i></button>
      </div>

      <!-- Loading -->
      <div class="loading" id="loading"><i class="fas fa-spinner fa-pulse"></i></div>

      <!-- Error -->
      <div class="error" id="error"></div>

      <!-- Weather Data -->
      <div id="weather">
        <div class="location-row">
          <div class="city"><i class="fas fa-map-marker-alt"></i> <span id="cityName">--</span></div>
          <div class="date-tag" id="date">--</div>
        </div>

        <div class="main-weather">
          <div class="temp-section"><span id="temp">--</span>°C</div>
          <div class="weather-icon" id="icon"><i class="fas fa-cloud"></i></div>
        </div>
        <div class="desc" id="desc">--</div>

        <div class="divider"></div>

        <div class="details-grid">
          <div class="detail-box">
            <i class="fas fa-tint"></i>
            <div class="label">Humidity</div>
            <div class="val" id="humidity">--</div>
          </div>
          <div class="detail-box">
            <i class="fas fa-wind"></i>
            <div class="label">Wind Speed</div>
            <div class="val" id="wind">--</div>
          </div>
          <div class="detail-box">
            <i class="fas fa-compress-arrows-alt"></i>
            <div class="label">Pressure</div>
            <div class="val" id="pressure">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer with your details -->
    <div class="footer">
      <span class="highlight">Aditya Raj Gupta</span> | Reg: 23151149023<br>
      <span class="highlight">CSE(AI) • 3rd Year</span> | Govt. Engineering College Gopalganj<br>
      Internship Project @ <span class="highlight">InternEra</span>
    </div>
  </div>

  <script>
    const API_KEY = 'bd5e378503939ddaee76f12ad7a97608';
    
    const weatherIcons = {
      '01d':'fa-sun','01n':'fa-moon','02d':'fa-cloud-sun','02n':'fa-cloud-moon',
      '03d':'fa-cloud','03n':'fa-cloud','04d':'fa-cloud','04n':'fa-cloud',
      '09d':'fa-cloud-rain','09n':'fa-cloud-rain','10d':'fa-cloud-sun-rain',
      '10n':'fa-cloud-moon-rain','11d':'fa-bolt','11n':'fa-bolt',
      '13d':'fa-snowflake','13n':'fa-snowflake','50d':'fa-smog','50n':'fa-smog'
    };

    function toggle(id,show){document.getElementById(id).style.display=show?'block':'none'}
    function showError(msg){document.getElementById('error').textContent=msg;toggle('error',true)}
    function hideError(){toggle('error',false)}
    
    async function getWeather(city){
      city = city || document.getElementById('city').value.trim();
      if(!city) return showError('⚠️ Please enter a city name');
      toggle('loading',true); hideError();
      try{
        const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`);
        if(!res.ok) throw new Error(res.status===404?'❌ City not found! Try again.' : '⚠️ Network error. Check connection.');
        const d = await res.json();
        
        document.getElementById('cityName').textContent = `${d.name}, ${d.sys.country||''}`;
        document.getElementById('date').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
        document.getElementById('temp').textContent = Math.round(d.main.temp);
        document.getElementById('icon').innerHTML = `<i class="fas ${weatherIcons[d.weather[0].icon]||'fa-cloud'}"></i>`;
        document.getElementById('desc').textContent = d.weather[0].description;
        document.getElementById('humidity').textContent = `${d.main.humidity}%`;
        document.getElementById('wind').textContent = `${Math.round(d.wind.speed*3.6)} km/h`;
        document.getElementById('pressure').textContent = `${d.main.pressure} hPa`;
        toggle('loading',false);
      }catch(e){toggle('loading',false);showError(e.message)}
    }

    document.getElementById('city').addEventListener('keypress',e=>{if(e.key==='Enter')getWeather()});
    window.addEventListener('load',()=>getWeather('Gopalganj'));
  </script>
</body>
</html>
